<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
        }

        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 42px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-name {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .welcome-subtitle {
            font-size: 18px;
            color: #999;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        /* 环境标签 */
        .env-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .env-badge.dev {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .env-badge.prod {
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <div class="welcome-icon">🎉</div>
        <h1 class="welcome-title">欢迎</h1>
        <h2 class="welcome-name" th:text="${name}">刘翔</h2>
        <p class="welcome-subtitle">WELCOME · 欢迎光临</p>

        <!-- 环境标签 -->
        <span class="env-badge" th:class="'env-badge ' + ${env}"
              th:text="${env == 'prod' ? '🔴 生产环境' : '🟢 测试环境'}">
            🟢 测试环境
        </span>
    </div>
</body>
</html>
