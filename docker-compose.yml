services:
  # ===== 开发/测试环境 =====
  welcome-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: dev
    image: welcome-liuxiang:dev
    container_name: welcome-liuxiang-dev
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ===== 线上生产环境 =====
  welcome-app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: prod
    image: welcome-liuxiang:prod
    container_name: welcome-liuxiang-prod
    ports:
      - "8081:8081"
    restart: unless-stopped
